name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.0.1). Leave blank to auto-tag as v1.0.<run_number>."
        required: false
        default: ""
      prerelease:
        description: "Mark GitHub Release as pre-release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Robolectric Android SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-sdk-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-sdk-${{ runner.os }}-

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Resolve version & release metadata
        id: meta
        shell: bash
        run: |
          RUN_NUM="${{ github.run_number }}"
          EVENT_NAME="${{ github.event_name }}"
          REF="${{ github.ref }}"
          SHOULD_RELEASE="false"
          IS_PRERELEASE="false"

          if [[ "$REF" == refs/tags/v* ]]; then
            RAW_TAG="${REF#refs/tags/}"
            CLEAN_VER="${RAW_TAG#v}"
            TAG_NAME="$RAW_TAG"
            SHOULD_RELEASE="true"
            if [[ "$CLEAN_VER" == *"-"* ]]; then
              IS_PRERELEASE="true"
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            INPUT_TAG="${{ github.event.inputs.release_tag }}"
            if [[ -n "$INPUT_TAG" ]]; then
              TAG_NAME="$INPUT_TAG"
              CLEAN_VER="${INPUT_TAG#v}"
            else
              CLEAN_VER="1.0.${RUN_NUM}"
              TAG_NAME="v${CLEAN_VER}"
            fi
            SHOULD_RELEASE="true"
            IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            CLEAN_VER="1.0.${RUN_NUM}"
            TAG_NAME="v${CLEAN_VER}"
          fi

          # Compute monotonic integer versionCode from MAJOR.MINOR.PATCH when available
          CORE_VER="${CLEAN_VER%%-*}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE_VER"
          if [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            VER_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
            if (( VER_CODE < 1 )); then VER_CODE=1; fi
          else
            VER_CODE=$(( 100 + RUN_NUM ))
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VER_CODE}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Prepare debug keystore
        id: debug_key
        shell: bash
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          KEY_SOURCE="existing debug.keystore"
          if [[ ! -f debug.keystore ]]; then
            if [[ -n "$DEBUG_KEYSTORE_B64" ]]; then
              printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > debug.keystore || true
              KEY_SOURCE="Debug (DEBUG_KEYSTORE_BASE64 secret)"
            elif [[ -f debug.keystore.base64 ]]; then
              tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || true
              KEY_SOURCE="Debug (consistent CI keystore)"
            fi
          fi

          if [[ ! -s debug.keystore ]] || ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
            echo "::warning::debug.keystore was missing or invalid (debug.keystore.base64 not found in repo or DEBUG_KEYSTORE_BASE64 secret not set). Generating a fresh debug keystore for this build. To allow in-place in-app updates across releases, configure ANDROID_KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD (or DEBUG_KEYSTORE_BASE64) in GitHub Repository Secrets."
            rm -f debug.keystore
            keytool -genkeypair \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            KEY_SOURCE="Debug (ephemeral CI keystore)"
          fi

          echo "source=${KEY_SOURCE}" >> "$GITHUB_OUTPUT"

      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.STORE_PASSWORD }}
          KEY_PW: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PW" && -n "$KEY_PW" ]]; then
            RESOLVED_ALIAS="${KEY_ALIAS_SECRET:-upload}"
            KEYSTORE_FILE="${{ runner.temp }}/upload-keystore.jks"
            VERIFY_FILE="${{ runner.temp }}/verify-key.p12"

            if ! printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE" || [[ ! -s "$KEYSTORE_FILE" ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 could not be decoded. Re-encode with 'base64 -w 0 my-upload-key.jks' and update the secret."
              exit 1
            fi

            if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PW" >/dev/null 2>&1; then
              echo "::error::Could not open keystore with STORE_PASSWORD. Verify ANDROID_KEYSTORE_BASE64 and STORE_PASSWORD."
              exit 1
            fi

            if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PW" -alias "$RESOLVED_ALIAS" >/dev/null 2>&1; then
              echo "::error::KEY_ALIAS was not found in the keystore. Verify KEY_ALIAS matches the -alias used in keytool -genkeypair."
              exit 1
            fi

            rm -f "$VERIFY_FILE"
            if ! keytool -importkeystore \
              -srckeystore "$KEYSTORE_FILE" \
              -srcstorepass "$STORE_PW" \
              -srckeypass "$KEY_PW" \
              -srcalias "$RESOLVED_ALIAS" \
              -destkeystore "$VERIFY_FILE" \
              -deststoretype PKCS12 \
              -deststorepass "verify123456" \
              -noprompt >/dev/null 2>&1; then
              rm -f "$VERIFY_FILE"
              echo "::error::KEY_PASSWORD failed to unlock the private key. For PKCS12 keystores, KEY_PASSWORD must match STORE_PASSWORD."
              exit 1
            fi
            rm -f "$VERIFY_FILE"

            echo "Release keystore, alias, store password, and key password verified."
            echo "has_release_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets not all configured; falling back to Debug APK."
            echo "has_release_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit & Robolectric tests
        run: >
          gradle :app:testDebugUnitTest --no-daemon --no-configuration-cache --console=plain
          -PappVersionName="${{ steps.meta.outputs.version_name }}"
          -PappVersionCode="${{ steps.meta.outputs.version_code }}"
          -PgithubRepo="${{ github.repository }}"

      - name: Build signed Release APK (when release secrets configured)
        if: steps.signing.outputs.has_release_key == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          gradle :app:assembleRelease --no-daemon --no-configuration-cache --console=plain
          -PappVersionName="${{ steps.meta.outputs.version_name }}"
          -PappVersionCode="${{ steps.meta.outputs.version_code }}"
          -PgithubRepo="${{ github.repository }}"

      - name: Build Debug APK (consistent debug keystore fallback)
        if: steps.signing.outputs.has_release_key != 'true'
        run: >
          gradle :app:assembleDebug --no-daemon --no-configuration-cache --console=plain
          -PappVersionName="${{ steps.meta.outputs.version_name }}"
          -PappVersionCode="${{ steps.meta.outputs.version_code }}"
          -PgithubRepo="${{ github.repository }}"

      - name: Package APK, SHA-256 checksum, and update-manifest.json
        id: package
        shell: bash
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          VER_NAME: ${{ steps.meta.outputs.version_name }}
          VER_CODE: ${{ steps.meta.outputs.version_code }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          mkdir -p dist
          APK_NAME="LumaCast-v${VER_NAME}.apk"

          if [[ "${{ steps.signing.outputs.has_release_key }}" == "true" ]]; then
            SRC_APK="app/build/outputs/apk/release/app-release.apk"
            BUILD_VARIANT="Release"
          else
            SRC_APK="app/build/outputs/apk/debug/app-debug.apk"
            BUILD_VARIANT="${{ steps.debug_key.outputs.source }}"
          fi

          cp "$SRC_APK" "dist/${APK_NAME}"
          sha256sum "dist/${APK_NAME}" | awk '{print $1}' > "dist/${APK_NAME}.sha256"
          SHA256_HEX="$(cat "dist/${APK_NAME}.sha256")"
          APK_SIZE="$(wc -c < "dist/${APK_NAME}" | tr -d ' ')"
          APK_URL="https://github.com/${REPO_SLUG}/releases/download/${TAG_NAME}/${APK_NAME}"

          python3 - <<PY
          import json
          manifest = {
              "versionName": "${VER_NAME}",
              "versionCode": int("${VER_CODE}"),
              "releaseTag": "${TAG_NAME}",
              "releaseName": "LumaCast ${TAG_NAME}",
              "releaseNotes": "Performance improvements, Chromecast streaming stability, and bug fixes.",
              "minimumSupportedVersion": 1,
              "apkUrl": "${APK_URL}",
              "sha256": "${SHA256_HEX}",
              "fileSizeBytes": int("${APK_SIZE}"),
              "mandatoryUpdate": False
          }
          with open("dist/update-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          PY

          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256_HEX}" >> "$GITHUB_OUTPUT"
          echo "variant=${BUILD_VARIANT}" >> "$GITHUB_OUTPUT"

      - name: Upload APK & manifest build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaCast-v${{ steps.meta.outputs.version_name }}
          path: |
            dist/*.apk
            dist/*.sha256
            dist/update-manifest.json
          retention-days: 30

      - name: Publish GitHub Release with APK & manifest
        if: steps.meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: LumaCast ${{ steps.meta.outputs.tag_name }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          body: |
            Automated **LumaCast** APK build from GitHub Actions.

            - **Version**: `v${{ steps.meta.outputs.version_name }}` (`versionCode ${{ steps.meta.outputs.version_code }}`)
            - **Signing**: `${{ steps.package.outputs.variant }}`
            - **SHA-256**: `${{ steps.package.outputs.sha256 }}`
          files: |
            dist/${{ steps.package.outputs.apk_name }}
            dist/${{ steps.package.outputs.apk_name }}.sha256
            dist/update-manifest.json
